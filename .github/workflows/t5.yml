name: t5

on:
  schedule:
    - cron: "*/30 * * * *"      # 每 30 分钟
  workflow_dispatch:            # 也可手动触发

permissions:
  contents: write                # 需要提交 status.json

concurrency:
  group: codex-reset-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 只用标准库，无需 pip install
      - name: 跑监控（判定 + 翻译 -> public/status.json）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CODEX_STATE: .state.json
          CODEX_STATUS: public/status.json
        run: python monitor.py

      - name: 提交状态变更
        run: |
          git config user.email "bot@users.noreply.github.com"
          git config user.name "codex-reset-bot"
          git add -A
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
          else
            git commit -m "chore: update codex reset status $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
