name: codex-reset-monitor

on:
  schedule:
    - cron: "*/30 * * * *"      # 每 30 分钟
  workflow_dispatch:            # 也可手动触发

permissions:
  contents: write                # 需要提交 status.json

concurrency:
  group: codex-reset-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 只用标准库，无需 pip install
      - name: 跑监控（判定 + 翻译 -> public/status.json）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CODEX_STATE: .state.json
          CODEX_STATUS: public/status.json
        run: python monitor.py

      - name: 提交状态变更
        run: |
          git config user.email "bot@users.noreply.github.com"
          git config user.name "codex-reset-bot"
          git add -A
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
          else
            git commit -m "chore: update codex reset status $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # ⚠️ 2026-09-16 实测坑：人工在本地推送时，这里会撞车被拒
            #    （! [rejected] master -> master (fetch first)），整个 job 记 failure。
            #    解法 = 先 rebase 再推；失败则合并（冲突时保留机器人算出的状态）并重试。
            for i in 1 2 3; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
                if git push >/dev/null 2>&1; then echo "✅ 推送成功（第 $i 次）"; break; fi
              else
                git rebase --abort >/dev/null 2>&1 || true
                git merge -X ours origin/"${GITHUB_REF_NAME}" \
                  -m "merge: keep robot-computed status" >/dev/null 2>&1 || true
                if git push >/dev/null 2>&1; then echo "✅ 合并后推送成功（第 $i 次）"; break; fi
              fi
              echo "第 $i 次推送失败，5 秒后重试"; sleep 5
            done
          fi
