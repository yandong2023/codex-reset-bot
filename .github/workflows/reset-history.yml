name: reset-history

on:
  schedule:
    - cron: "0 4 * * *"          # 每天 UTC 04:00（北京时间 12:00）
  workflow_dispatch:              # 也可手动触发

permissions:
  contents: write                 # 需要提交 reset-history.json

concurrency:
  group: reset-history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 只用标准库 + curl，无需 pip install
      # ① 主源：codexresets.com 日历页（历史最全，含原始推文链接）
      - name: 导入重置历史（日历源）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HISTORY_OUT: public/reset-history.json
        run: python scripts/import-reset-history.py

      # ② 补充：直接抓 @thsottiaux 时间线（抓最新的，可能还没进日历）
      #    失败不影响整体（历史已由①保证）
      - name: 增量抓取时间线（补最新重置）
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HISTORY_OUT: public/reset-history.json
          HISTORY_PAGES: "2"
        run: python scripts/build-reset-history.py

      - name: 提交历史变更
        run: |
          git config user.email "bot@users.noreply.github.com"
          git config user.name "codex-reset-bot"
          git add -A
          if git diff --cached --quiet; then
            echo "历史无变化，跳过提交"
          else
            git commit -m "chore: rebuild reset history $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
